services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env

    environment:
      HASH_VERIFY: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432

    volumes:
      - storage_data:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    mem_limit: 512m

    networks:
      - laravel_network


  nginx:
    image: nginx:alpine

    container_name: laravel_nginx

    restart: unless-stopped

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro

    depends_on:
      - app

    mem_limit: 128m

    networks:
      - laravel_network


  db:
    image: postgres:17-alpine

    container_name: laravel_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30

    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    mem_limit: 512m

    networks:
      - laravel_network


  caddy:
    image: caddy:2-alpine

    container_name: laravel_caddy

    restart: unless-stopped

    environment:
      APP_DOMAIN: ${APP_DOMAIN}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - nginx

    mem_limit: 128m

    networks:
      - laravel_network


volumes:
  db_data:
  storage_data:
  caddy_data:
  caddy_config:


networks:
  laravel_network:
    driver: bridge
